<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08101E"/>
      <stop offset="50%" stop-color="#0D1E3A"/>
      <stop offset="100%" stop-color="#050A14"/>
    </linearGradient>
    <linearGradient id="dieGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142C54"/>
      <stop offset="50%" stop-color="#1769D1"/>
      <stop offset="100%" stop-color="#0E2140"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1769D1" stroke-width="0.75" stroke-opacity="0.2"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#grid)"/>

  <!-- Radial Glow Behind Chip -->
  <circle cx="400" cy="225" r="220" fill="url(#glow)"/>

  <!-- Bus Lines -->
  <g stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.4" fill="none">
    <path d="M 60 80 L 220 80 L 280 140 L 320 140"/>
    <path d="M 60 225 L 260 225 L 320 225"/>
    <path d="M 60 370 L 220 370 L 280 310 L 320 310"/>
    <path d="M 740 80 L 580 80 L 520 140 L 480 140"/>
    <path d="M 740 225 L 540 225 L 480 225"/>
    <path d="M 740 370 L 580 370 L 520 310 L 480 310"/>
    <circle cx="220" cy="80" r="3" fill="#38BDF8" stroke="none"/>
    <circle cx="580" cy="80" r="3" fill="#38BDF8" stroke="none"/>
  </g>

  <!-- Multi-Chip Module Substrate (CDNA 4 / Instinct Package) -->
  <rect x="250" y="95" width="300" height="260" rx="16" fill="#0E182A" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- 8 Compute Chiplets (XCDs) -->
  <g fill="url(#dieGrad)" stroke="#38BDF8" stroke-width="1">
    <rect x="285" y="145" width="50" height="70" rx="4"/>
    <rect x="345" y="145" width="50" height="70" rx="4"/>
    <rect x="405" y="145" width="50" height="70" rx="4"/>
    <rect x="465" y="145" width="50" height="70" rx="4"/>
    <rect x="285" y="235" width="50" height="70" rx="4"/>
    <rect x="345" y="235" width="50" height="70" rx="4"/>
    <rect x="405" y="235" width="50" height="70" rx="4"/>
    <rect x="465" y="235" width="50" height="70" rx="4"/>
  </g>

  <!-- Central Bridge Labels -->
  <text x="400" y="222" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="900" text-anchor="middle" letter-spacing="2">AMD</text>
  <text x="400" y="240" fill="#93C5FD" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">INSTINCT MI350</text>

  <!-- HBM3e Memory Stacks -->
  <g fill="#0B1322" stroke="#38BDF8" stroke-width="0.75" stroke-opacity="0.8">
    <rect x="275" y="110" width="58" height="25" rx="3"/>
    <rect x="343" y="110" width="58" height="25" rx="3"/>
    <rect x="411" y="110" width="58" height="25" rx="3"/>
    <rect x="467" y="110" width="58" height="25" rx="3"/>
    <rect x="275" y="315" width="58" height="25" rx="3"/>
    <rect x="343" y="315" width="58" height="25" rx="3"/>
    <rect x="411" y="315" width="58" height="25" rx="3"/>
    <rect x="467" y="315" width="58" height="25" rx="3"/>
  </g>
  <text x="400" y="126" fill="#93C5FD" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">288GB HBM3e</text>
  <text x="400" y="331" fill="#93C5FD" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">8.0 TB/s BW</text>

  <!-- Technical Telemetry Badge (Bottom Left) -->
  <rect x="40" y="385" width="225" height="30" rx="6" fill="#0E182A" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.3"/>
  <circle cx="56" cy="400" r="4" fill="#1769D1"/>
  <text x="70" y="404" fill="#E2E8F0" font-family="monospace" font-size="10" font-weight="bold">AMD CDNA 4 ACCELERATOR</text>
  <text x="240" y="404" fill="#93C5FD" font-family="monospace" font-size="9">3nm</text>
</svg>
