<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120A1E"/>
      <stop offset="50%" stop-color="#1F1235"/>
      <stop offset="100%" stop-color="#0B0613"/>
    </linearGradient>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6C4CE8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#6C4CE8" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#6C4CE8" stroke-width="0.75" stroke-opacity="0.15"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#grid)"/>

  <!-- Radial Glow Behind Chip -->
  <circle cx="400" cy="225" r="230" fill="url(#purpleGlow)"/>

  <!-- Interconnect Bus Lines -->
  <g stroke="#A78BFA" stroke-width="1.5" stroke-opacity="0.4" fill="none">
    <path d="M 70 120 L 220 120 L 280 180 L 320 180"/>
    <path d="M 70 330 L 220 330 L 280 270 L 320 270"/>
    <path d="M 730 120 L 580 120 L 520 180 L 480 180"/>
    <path d="M 730 330 L 580 330 L 520 270 L 480 270"/>
    <circle cx="220" cy="120" r="3.5" fill="#A78BFA" stroke="none"/>
    <circle cx="580" cy="120" r="3.5" fill="#A78BFA" stroke="none"/>
  </g>

  <!-- AWS Trainium Package -->
  <rect x="270" y="105" width="260" height="240" rx="16" fill="#1A102A" stroke="#A78BFA" stroke-width="1.8" stroke-opacity="0.8"/>

  <!-- Core Die Matrix -->
  <rect x="300" y="135" width="200" height="150" rx="10" fill="#291942" stroke="#6C4CE8" stroke-width="1.2"/>

  <!-- Neuron Core Units -->
  <g fill="#1A102A" stroke="#A78BFA" stroke-width="0.75">
    <rect x="320" y="155" width="70" height="50" rx="4"/>
    <rect x="410" y="155" width="70" height="50" rx="4"/>
    <rect x="320" y="215" width="70" height="50" rx="4"/>
    <rect x="410" y="215" width="70" height="50" rx="4"/>
  </g>
  <text x="355" y="185" fill="#C4B5FD" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">NC1</text>
  <text x="445" y="185" fill="#C4B5FD" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">NC2</text>
  <text x="355" y="245" fill="#C4B5FD" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">NC3</text>
  <text x="445" y="245" fill="#C4B5FD" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">NC4</text>

  <!-- Labels -->
  <text x="400" y="315" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="900" text-anchor="middle" letter-spacing="1">AWS TRAINIUM 2</text>
  <text x="400" y="332" fill="#C4B5FD" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">CUSTOM AI SILICON CLUSTER</text>

  <!-- Telemetry Badge (Bottom Left) -->
  <rect x="40" y="385" width="230" height="30" rx="6" fill="#1A102A" stroke="#6C4CE8" stroke-width="1" stroke-opacity="0.3"/>
  <circle cx="56" cy="400" r="4" fill="#6C4CE8"/>
  <text x="70" y="404" fill="#E2E8F0" font-family="monospace" font-size="10" font-weight="bold">AWS NEURON ARCHITECTURE</text>
  <text x="245" y="404" fill="#C4B5FD" font-family="monospace" font-size="9">3.2TB</text>
</svg>
