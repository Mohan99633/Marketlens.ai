<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080E18"/>
      <stop offset="50%" stop-color="#0E1A2C"/>
      <stop offset="100%" stop-color="#040810"/>
    </linearGradient>
    <linearGradient id="waferGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142844"/>
      <stop offset="50%" stop-color="#1E3E6A"/>
      <stop offset="100%" stop-color="#0C1B30"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38BDF8" stroke-width="0.75" stroke-opacity="0.15"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#grid)"/>

  <!-- Radial Glow Behind Wafer -->
  <circle cx="400" cy="225" r="230" fill="url(#cyanGlow)"/>

  <!-- 300mm Silicon Wafer Representation -->
  <circle cx="400" cy="225" r="150" fill="url(#waferGrad)" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.8"/>
  <path d="M 390 75 Q 400 80 410 75" stroke="#38BDF8" stroke-width="3" fill="none"/>

  <!-- Die Grid on Wafer -->
  <g stroke="#38BDF8" stroke-width="0.75" stroke-opacity="0.4" fill="none">
    <line x1="280" y1="120" x2="280" y2="330"/>
    <line x1="320" y1="95" x2="320" y2="355"/>
    <line x1="360" y1="80" x2="360" y2="370"/>
    <line x1="400" y1="75" x2="400" y2="375"/>
    <line x1="440" y1="80" x2="440" y2="370"/>
    <line x1="480" y1="95" x2="480" y2="355"/>
    <line x1="520" y1="120" x2="520" y2="330"/>

    <line x1="280" y1="150" x2="520" y2="150"/>
    <line x1="260" y1="190" x2="540" y2="190"/>
    <line x1="250" y1="225" x2="550" y2="225"/>
    <line x1="260" y1="260" x2="540" y2="260"/>
    <line x1="280" y1="300" x2="520" y2="300"/>
  </g>

  <!-- Central Die Inspection Highlight -->
  <rect x="360" y="190" width="80" height="70" rx="4" fill="#0D2039" stroke="#38BDF8" stroke-width="1.8"/>

  <!-- Intel Logo & 18A Node Label -->
  <text x="400" y="222" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="900" text-anchor="middle" letter-spacing="1">INTEL</text>
  <text x="400" y="242" fill="#38BDF8" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">18A NODE</text>

  <!-- Telemetry Badge (Bottom Left) -->
  <rect x="40" y="385" width="235" height="30" rx="6" fill="#0E1A2C" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.3"/>
  <circle cx="56" cy="400" r="4" fill="#38BDF8"/>
  <text x="70" y="404" fill="#E2E8F0" font-family="monospace" font-size="10" font-weight="bold">INTEL FOUNDRY SERVICES</text>
  <text x="250" y="404" fill="#38BDF8" font-family="monospace" font-size="9">EUV</text>
</svg>
